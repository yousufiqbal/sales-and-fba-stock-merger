<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBM Stock Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="navMenuToggle" class="nav-menu-toggle" type="button" aria-label="Open navigation menu">
  <span></span><span></span><span></span>
</button>
<div id="navSidebarOverlay" class="nav-sidebar-overlay"></div>
<nav id="navSidebar" class="nav-sidebar">
  <a href="index.html" class="page-nav-link">Restock Report</a>
  <a href="fbm-stock.html" class="page-nav-link active">FBM Stock Check</a>
</nav>

<div class="container">
  <nav class="page-nav">
    <a href="index.html" class="page-nav-link">Restock Report</a>
    <a href="fbm-stock.html" class="page-nav-link active">FBM Stock Check</a>
  </nav>

  <h1>FBM Stock Check</h1>
  <p class="subtitle">Upload your FBM Inventory / Listings Report to find out-of-stock listings</p>

  <div class="upload-grid upload-grid-single">
    <div class="upload-card">
      <label for="fbmInventoryInput">FBM Inventory / Listings Report (.txt)</label>
      <input type="file" id="fbmInventoryInput" accept=".txt">
      <span class="file-status" id="fbmInventoryStatus">No file selected</span>
    </div>
  </div>

  <div class="filter-row">
    <label><input type="checkbox" id="showOosOnly"> Show only out-of-stock rows</label>
  </div>

  <div class="actions">
    <button id="mergeBtn" disabled>Process file</button>
  </div>

  <p id="errorMsg" class="error"></p>
  <p id="summaryMsg" class="summary"></p>

  <div class="results-layout">
    <div id="resultsContainer" class="results-main"></div>
    <nav id="groupNav" class="group-nav"></nav>
  </div>
</div>

<div id="jumpNavOverlay" class="jump-nav-overlay"></div>
<button id="jumpNavToggle" class="jump-nav-toggle" type="button">
  <span>Jump to product</span>
  <span class="jump-nav-toggle-arrow">▲</span>
</button>

<script src="nav.js"></script>
<script src="fbm-stock.js"></script>
</body>
</html>
